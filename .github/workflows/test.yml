# Runs the stub test suite and packaging checks on every push and pull request.
# This cannot test Bluetooth delivery or real e-reader behavior.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check plugin and archives
        run: scripts/build.sh --check
